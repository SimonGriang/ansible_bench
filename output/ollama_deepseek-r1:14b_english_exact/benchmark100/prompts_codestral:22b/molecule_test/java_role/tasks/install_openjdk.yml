---
- name: Java | Migrate adoptopenjdk to temurin (if selected)
  ansible.builtin.set_fact:
    java_jdk_vendor: "temurin"
  when: java_jdk_vendor == 'adoptopenjdk'

- name: Java | Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ java_jdk_vendor }}/{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"

- name: Java | Gather architecture specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "architecture.yml"

- name: Java | Setting OS specific variables (I)
  ansible.builtin.set_fact:
    java_open_jdk_version_major: >-
      {{ java_open_jdk_version_major if (java_open_jdk_version_major is defined
      and java_open_jdk_version_major is not sameas None and java_open_jdk_version_major)
      else __java_open_jdk_version_major }}
    java_required_repositories_openjdk: >-
      {{ java_required_repositories_openjdk if (java_required_repositories_openjdk is defined
      and java_required_repositories_openjdk is not sameas None and java_required_repositories_openjdk | length)
      else __java_required_repositories_openjdk }}
    java_required_key_repositories_openjdk: >-
      {{ java_required_key_repositories_openjdk if (java_required_key_repositories_openjdk is defined
      and java_required_key_repositories_openjdk is not sameas None and java_required_key_repositories_openjdk | length)
      else __java_required_key_repositories_openjdk }}
    java_required_libs_openjdk: >-
      {{ java_required_libs_openjdk if (java_required_libs_openjdk is defined
      and java_required_libs_openjdk is not sameas None and java_required_libs_openjdk | length)
      else __java_required_libs_openjdk }}
    java_deprecated_repositories_adoptopenjdk: >-
      {{ java_deprecated_repositories_adoptopenjdk if (java_deprecated_repositories_adoptopenjdk is defined
      and java_deprecated_repositories_adoptopenjdk is not sameas None and java_deprecated_repositories_adoptopenjdk | length)
      else __java_deprecated_repositories_adoptopenjdk }}

- name: Java | Setting OS and architecture specific variables (II)
  ansible.builtin.set_fact:
    java_open_jdk_home_dir: >-
      {{ java_open_jdk_home_dir if (java_open_jdk_home_dir is defined
      and java_open_jdk_home_dir is not sameas None and java_open_jdk_home_dir)
      else __java_open_jdk_home_dir }}
    java_open_jdk_package: >-
      {{ java_open_jdk_package if (java_open_jdk_package is defined
      and java_open_jdk_package is not sameas None and java_open_jdk_package)
      else __java_open_jdk_package }}

- name: Java | Setting specific variables
  ansible.builtin.set_fact:
    java_home: "{{ java_open_jdk_home }}"

- name: Java | Debian pre-requisites
  when: ansible_os_family == 'Debian'
  block:
    - name: Java | Remove deprecated repositories
      ansible.builtin.apt_repository:
        repo: "{{ item }}"
        state: absent
      loop: "{{ java_deprecated_repositories_adoptopenjdk }}"
      when: java_deprecated_repositories_adoptopenjdk | length > 0

    - name: Java | Install extra apt tools
      ansible.builtin.package:
        name: "{{ java_open_jdk_apt_extra_packages }}"
        state: present
      register: apt_tools_installed
      until: apt_tools_installed is succeeded
      when: java_open_jdk_apt_extra_packages | length > 0

    - name: Java | Add required key repositories, Debian
      ansible.builtin.apt_key:
        url: "{{ item }}"
        state: present
      loop: "{{ java_required_key_repositories_openjdk }}"

    - name: Java | Add required repositories, Debian
      ansible.builtin.apt_repository:
        repo: "{{ item }}"
        state: present
        update_cache: true
      loop: "{{ java_required_repositories_openjdk }}"

- name: Java | RedHat pre-requisites
  when: ansible_os_family == 'RedHat'
  block:
    - name: Java | Add required key repositories, RedHat
      ansible.builtin.rpm_key:
        key: "{{ item }}"
        state: present
      loop: "{{ java_required_key_repositories_openjdk }}"

    - name: Java | Add required repositories, RedHat
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: OpenJDK YUM alt repo
        file: "{{ item.name }}.repo"
        baseurl: "{{ item.baseurl }}"
        gpgcheck: true
      loop: "{{ java_required_repositories_openjdk }}"

- name: Java | Install required libs
  ansible.builtin.package:
    name: "{{ java_required_libs_openjdk }}"
    state: present
  register: java_required_libs_installed
  until: java_required_libs_installed is succeeded

- name: Java | Install Java, Debian
  ansible.builtin.apt:
    name: >-
      {{ (java_open_jdk_package + '=' + java_open_jdk_version)
      if (java_open_jdk_version is defined and java_open_jdk_version is not sameas None)
      else java_open_jdk_package }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: java_package_installed
  until: java_package_installed is succeeded
  when: ansible_os_family == 'Debian'

- name: Java | Install Java, RedHat
  ansible.builtin.dnf:
    name: >-
      {{ (java_open_jdk_package + '-' + java_open_jdk_version)
      if (java_open_jdk_version is defined and java_open_jdk_version is not sameas None)
      else java_open_jdk_package }}
    state: present
    update_cache: true
  register: java_package_installed
  until: java_package_installed is succeeded
  when: ansible_os_family == 'RedHat'

- name: Java | Export environment variables
  ansible.builtin.template:
    src: jdk.sh.j2
    dest: /etc/profile.d/jdk.sh
    mode: '0755'
    owner: root
    group: root

- name: Java | Source environment variables
  ansible.builtin.shell: source /etc/profile
  args:
    executable: /bin/bash
  changed_when: false
  tags:
    - skip_ansible_lint

- name: Java | Select correct java version (< 11)
  community.general.alternatives:
    name: java
    path: "/usr/lib/jvm/{{ java_open_jdk_home_dir }}/jre/bin/java"
  when:
    - ansible_os_family == 'Debian'
    - java_open_jdk_version_major | int < 11

- name: Java | Select correct java version (>= 11)
  community.general.alternatives:
    name: java
    path: "/usr/lib/jvm/{{ java_open_jdk_home_dir }}/bin/java"
  when:
    - ansible_os_family == 'Debian'
    - java_open_jdk_version_major | int >= 11

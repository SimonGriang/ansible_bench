---
- name: Install git on webservers
  hosts: webservers
  become: true
  vars:
    git_package: git
  tasks:
    - name: Install git package
      ansible.builtin.package:
        name: "{{ git_package }}"
        state: present
      tags: [install]
      notify: Ensure git service is running

  handlers:
    - name: Ensure git service is running
      ansible.builtin.service:
        name: git
        state: started
        enabled: true
      tags: [service]

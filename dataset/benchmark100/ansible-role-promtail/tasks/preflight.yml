---
- name: Assert usage of systemd as init system
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    msg: "This module only works with systemd"

- name: Determine latest promtail version if requested
  when: promtail_version == "latest"
  delegate_to: localhost
  run_once: true
  block:
    - name: Get latest release from GitHub API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/grafana/loki/releases/latest"
        method: GET
        return_content: true
        status_code: 200
        body_format: json
        validate_certs: false
        user: "{{ lookup('env', 'GH_USER') | default(omit) }}"
        password: "{{ lookup('env', 'GH_TOKEN') | default(omit) }}"
      no_log: "{{ not lookup('env', 'ANSIBLE_DEBUG') | bool }}"
      register: _latest_release
      until: _latest_release.status == 200
      retries: 5

    - name: Set promtail version fact ({{ _latest_release.json.tag_name[1:] }})
      ansible.builtin.set_fact:
        promtail_version: "{{ _latest_release.json.tag_name[1:] }}"

- name: Validate local binary archive if defined
  when: promtail_binary_local_dir | length > 0
  block:
    - name: Check if local zip archive exists
      ansible.builtin.stat:
        path: "{{ promtail_binary_local_dir }}/{{ promtail_version }}_promtail-linux-{{ go_arch }}.zip"
      register: promtail_binary_local_archive
      delegate_to: localhost
      run_once: true

    - name: Assert local binary exists
      ansible.builtin.assert:
        that:
          - promtail_binary_local_archive.stat.exists
        msg: "When using 'promtail_binary_local_dir' please ensure that the binary exists"

- name: Retrieve and verify promtail checksums if no local binary provided
  when: promtail_binary_local_dir | length == 0
  block:
    - name: Fetch checksum list for promtail version
      ansible.builtin.set_fact:
        __promtail_checksums: >-
          {{ lookup('url', 'https://github.com/grafana/loki/releases/download/v' + promtail_version + '/SHA256SUMS', wantlist=true) | list }}
      run_once: true

    - name: Extract checksum for architecture {{ go_arch }}
      ansible.builtin.set_fact:
        __promtail_checksum: "{{ item.split(' ')[0] }}"
      loop: "{{ __promtail_checksums }}"
      when: "'promtail-linux-' + go_arch + '.zip' in item"
